version: 2
updates:
  # Keeps the commit-pinned actions in the workflows current. The cooldown
  # holds back any release younger than two weeks, so a compromised release is
  # likely to be found and pulled before it is proposed here.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  # The package has no runtime dependencies; this keeps the exactly pinned
  # development tools and the lockfile current, under the same cooldown.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm:
        patterns: ["*"]
